name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            simulator/requirements.txt
            batch_source/requirements.txt
      # Same scope as `make test` (test-simulator + test-batch). One
      # environment for both -- their pins don't conflict (both pin
      # python-dotenv==1.0.1 / pytest==8.2.2 identically) -- rather than two
      # separate venvs like the local Makefile targets use.
      - run: pip install -r simulator/requirements.txt -r batch_source/requirements.txt
      - run: pytest tests/test_event_generator.py tests/test_quality_checks.py tests/test_transform_to_bronze.py -v

  dbt-tests:
    runs-on: ubuntu-latest
    env:
      # Point the dbt project at a small committed fixture instead of the
      # real, gitignored, Kaggle-sourced data/bronze/ -- these are the same
      # env vars warehouse/models/staging/*/_*__sources.yml already reads
      # (Phase 3's design), so nothing in the dbt project itself changes.
      BRONZE_OUTPUT_PATH: tests/fixtures/bronze/events
      HISTORICAL_BRONZE_OUTPUT_PATH: tests/fixtures/bronze/events_historical
      DBT_DUCKDB_PATH: warehouse/ci_clickstream.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: warehouse/requirements.txt
      - run: pip install -r warehouse/requirements.txt
      - run: dbt deps --project-dir warehouse
      # dbt build = run + test in dependency order, against the fixture data
      # above -- exercises staging, sessionization, marts, and all generic
      # tests for real, not just dbt parse/compile.
      - run: dbt build --project-dir warehouse --profiles-dir warehouse

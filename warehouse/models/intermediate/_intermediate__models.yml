version: 2

models:
  - name: int_events_unioned
    description: Conformed event stream -- UNION ALL of stg_events_stream and stg_events_historical.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null

  - name: int_sessions
    description: One row per session, real (stream) or inferred via a {{ var('session_gap_minutes') }}-minute gap heuristic (historical).
    columns:
      - name: session_id
        tests:
          - unique
          - not_null

  - name: int_sessionized_events
    description: int_events_unioned with a session_id (real or inferred) and in-session event_sequence_number attached to every row.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: session_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_sessions')
                field: session_id

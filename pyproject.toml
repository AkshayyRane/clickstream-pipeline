[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9 (real pycodestyle issues) + F (pyflakes: unused imports/vars,
# undefined names) + I (import sorting). Deliberately no E5 (line length) --
# this codebase's established style uses long prose comments explaining
# design decisions (see any module docstring), and reflowing all of them to
# satisfy a line-length rule is unrelated churn that doesn't belong in a
# CI-adding PR.
select = ["E4", "E7", "E9", "F", "I"]
